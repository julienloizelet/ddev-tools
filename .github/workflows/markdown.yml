on:
  workflow_dispatch:

name: Markdown files test and update

permissions:
  contents: write
  pull-requests: write

jobs:
  markdown-test-and-update:
    name: Markdown files test and update
    runs-on: ubuntu-latest
    steps:

      - name: Clone sources
        uses: actions/checkout@v5
        with:
          path: extension

      - name: Launch localhost server
        run: |
          sudo npm install --global http-server
          http-server ./extension &

      - name: Set up Ruby 2.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Check links in Markdown files
        run: |
          gem install awesome_bot
          cd extension
          awesome_bot --files README.md --allow-dupe --allow 401 --skip-save-results --white-list repo.magento.com,ddev.site --base-url http://localhost:8080/
